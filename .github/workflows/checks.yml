name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: uv sync --locked
      - name: Start pinned isolated Qdrant
        run: |
          docker run -d --name qdrant-tests -p 127.0.0.1:6333:6333 \
            --memory=768m --cpus=1 \
            qdrant/qdrant@sha256:0e8273b9130ca3b0dd9dcfaa8f55342066711f8aaeb2aa072e53344c42ecf57f
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:6333/readyz && exit 0
            sleep 1
          done
          exit 1
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
        env:
          QDRANT_TEST_URL: http://127.0.0.1:6333
      - run: npm ci --ignore-scripts
      - run: npm run test:interop
