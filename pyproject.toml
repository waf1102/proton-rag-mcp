[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proton-rag-mcp"
version = "0.1.0"
description = "Proton Mail retrieval with local indexing, cited answers and read-only MCP"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1", "pypdf>=6,<7", "python-docx>=1.2,<2"]

[project.scripts]
proton-rag = "proton_rag.daemon:main"
proton-rag-mcp = "proton_rag.mcp_server:main"
proton-rag-maintain = "proton_rag.maintenance:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/proton_rag"]
